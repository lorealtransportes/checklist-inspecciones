<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consulta de Inspecciones | L'Oreal Operations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#1a1a1a; --amber:#c9a84c; --amber-lt:#fdf8ed;
    --green:#16a34a; --green-lt:#f0fdf4; --red:#dc2626; --red-lt:#fef2f2;
    --bg:#2b2b2b; --line:#e8e8e8; --muted:#8a8a8a; --card:#ffffff;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color:var(--black); font-weight:400; }
  .page { width:min(1200px, calc(100% - 24px)); margin:0 auto; padding:24px 0 48px; }

  .header {
    background:linear-gradient(135deg, #1a1a1a 0%, #000 100%);
    color:#fff; padding:22px 28px; border-radius:18px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
    box-shadow:0 6px 20px rgba(0,0,0,.12);
  }
  .header h1 { margin:0; font-size:19px; font-weight:700; letter-spacing:-.3px; }
  .header .sub { font-size:12px; color:var(--amber); margin-top:4px; font-weight:500; letter-spacing:.3px; }
  .pais-badge { background:var(--amber); color:#1a1a1a; padding:8px 18px; border-radius:10px; font-weight:700; font-size:14px; }

  .filters {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px 20px; margin-bottom:18px; display:flex; gap:14px; flex-wrap:wrap;
    align-items:center; justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,.03);
  }
  .filters-left { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .filters input, .filters select {
    padding:9px 12px; border-radius:10px; border:1px solid var(--line);
    font-size:13px; font-family:inherit; color:var(--black); font-weight:400;
  }
  .btn-excel {
    background:var(--green); color:#fff; border:none; padding:10px 18px;
    border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;
    transition:opacity .15s;
  }
  .btn-excel:hover:not(:disabled) { opacity:.85; }
  .btn-excel:disabled { opacity:.5; cursor:not-allowed; }

  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:16px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  th { background:var(--black); color:var(--amber); text-align:left; padding:12px 14px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  td { padding:12px 14px; font-size:13px; border-bottom:1px solid var(--line); font-weight:400; }
  td b { font-weight:600; }
  tr:hover td { background:#fafafa; }
  .badge { padding:4px 12px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.completo { background:var(--green-lt); color:var(--green); }
  .badge.pending { background:var(--amber-lt); color:#a3822f; }
  .btn-ver {
    background:var(--black); color:#fff; border:none; padding:7px 14px;
    border-radius:8px; font-size:12px; font-weight:500; cursor:pointer; font-family:inherit;
    transition:background .15s;
  }
  .btn-ver:hover { background:#333; }

  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--card); border-radius:20px; width:min(720px, 100%); max-height:88vh; overflow-y:auto; }
  .modal-head { background:var(--black); color:#fff; padding:20px 26px; border-radius:20px 20px 0 0; position:sticky; top:0; }
  .modal-head h2 { margin:0; font-size:17px; font-weight:700; }
  .modal-head .modal-close { float:right; cursor:pointer; font-weight:500; font-size:18px; color:var(--amber); margin-top:-24px; }
  .modal-body { padding:22px 26px; }

  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; background:var(--bg); border-radius:12px; padding:16px; margin-bottom:20px; font-size:13px; font-weight:400; }
  .info-grid b { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; display:block; margin-bottom:2px; letter-spacing:.3px; }

  .item-card { border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
  .item-card .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-card .item-num { color:var(--muted); font-weight:600; font-size:12px; }
  .item-card .item-txt { font-size:13px; font-weight:400; flex:1; }
  .pill-si { background:var(--green-lt); color:var(--green); padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .pill-no { background:var(--red-lt); color:var(--red); padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
  .item-card .item-extra { font-size:12px; color:var(--muted); margin-top:6px; font-weight:400; }
  .item-card a { display:inline-block; margin-right:10px; margin-top:8px; font-size:12px; color:var(--black); text-decoration:none; background:var(--amber-lt); padding:5px 12px; border-radius:8px; font-weight:500; }
  .item-card a:hover { background:var(--amber); }

  .empty { text-align:center; padding:48px; color:var(--muted); font-weight:400; }
  .error-pais { text-align:center; padding:60px 20px; color:var(--red); font-weight:600; font-size:15px; }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Consulta de Inspecciones</h1>
      <div class="sub" id="paisSub">L'OREAL OPERATIONS · REPOSITORIO DE EVIDENCIAS</div>
    </div>
    <div class="pais-badge" id="paisBadge">-</div>
  </div>

  <div class="filters">
    <div class="filters-left">
      <input type="date" id="filtroFecha" onchange="aplicarFiltros()" />
      <select id="filtroTransportadora" onchange="aplicarFiltros()"><option value="">Todas las transportadoras</option></select>
      <input type="text" id="filtroPlaca" placeholder="Buscar por placa..." oninput="aplicarFiltros()" />
    </div>
    <button class="btn-excel" id="btnExcel" onclick="exportarExcel()">⬇ Descargar Excel</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th><th>Transportadora</th><th>Responsable</th><th>Conductor</th>
        <th>Placa</th><th>Estado</th><th></th>
      </tr>
    </thead>
    <tbody id="tablaBody">
      <tr><td colspan="7" class="empty">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-close" onclick="cerrarModal()">✕</span>
      <h2 id="modalTitulo">Detalle de inspeccion</h2>
    </div>
    <div class="modal-body" id="modalContenido">Cargando...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ybqblngehgpqthmjsisj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicWJsbmdlaGdwcXRobWpzaXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDY5MjYsImV4cCI6MjEwMzc4MjkyNn0.QOdM7HxPlRhdoA4X8xtIRXCK_noRgXygT1CtgZVdB3E";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
const PAIS_CODIGO = (params.get('pais') || '').toUpperCase();
const NOMBRES_PAIS = { CO: 'Colombia', PE: 'Peru' };

let PAIS_ID = null;
let INSPECCIONES = [];
let TRANSPORTADORAS_MAP = {};
let FILTRADAS_ACTUALES = [];

if (!PAIS_CODIGO || !NOMBRES_PAIS[PAIS_CODIGO]) {
  document.getElementById('paisBadge').innerText = '?';
  document.querySelector('.page').innerHTML = `
    <div class="header"><div><h1>Consulta de Inspecciones</h1></div></div>
    <div class="error-pais">Falta indicar el pais en el enlace.<br/>Usa ?pais=CO o ?pais=PE al final de la URL.</div>
  `;
} else {
  document.getElementById('paisBadge').innerText = NOMBRES_PAIS[PAIS_CODIGO];
  cargarDatos();
}

async function cargarDatos() {
  document.getElementById('tablaBody').innerHTML = '<tr><td colspan="7" class="empty">Cargando...</td></tr>';

  const { data: pais } = await db.from('paises').select('id').eq('codigo', PAIS_CODIGO).single();
  if (!pais) {
    document.getElementById('tablaBody').innerHTML = '<tr><td colspan="7" class="empty">Pais no encontrado en la base de datos.</td></tr>';
    return;
  }
  PAIS_ID = pais.id;

  const { data: transp } = await db.from('transportadoras').select('id, nombre').eq('pais_id', PAIS_ID);
  TRANSPORTADORAS_MAP = {};
  (transp || []).forEach(t => TRANSPORTADORAS_MAP[t.id] = t.nombre);

  const selectTransp = document.getElementById('filtroTransportadora');
  selectTransp.innerHTML = '<option value="">Todas las transportadoras</option>' +
    (transp || []).map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

  const { data: inspecciones, error } = await db.from('inspecciones')
    .select('*')
    .eq('pais_id', PAIS_ID)
    .order('creado_en', { ascending: false });

  if (error) {
    document.getElementById('tablaBody').innerHTML = `<tr><td colspan="7" class="empty">Error: ${error.message}</td></tr>`;
    return;
  }

  INSPECCIONES = inspecciones || [];
  aplicarFiltros();
}

function aplicarFiltros() {
  const fecha = document.getElementById('filtroFecha').value;
  const transpId = document.getElementById('filtroTransportadora').value;
  const placaTxt = document.getElementById('filtroPlaca').value.toUpperCase().trim();

  FILTRADAS_ACTUALES = INSPECCIONES.filter(i => {
    if (fecha && i.fecha_inspeccion !== fecha) return false;
    if (transpId && String(i.transportadora_id) !== transpId) return false;
    if (placaTxt && !i.placa.includes(placaTxt)) return false;
    return true;
  });

  renderTabla(FILTRADAS_ACTUALES);
}

function renderTabla(lista) {
  const tbody = document.getElementById('tablaBody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No hay inspecciones que coincidan con el filtro.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(i => `
    <tr>
      <td>${i.fecha_inspeccion}</td>
      <td>${TRANSPORTADORAS_MAP[i.transportadora_id] || '-'}</td>
      <td>${esc(i.responsable)}</td>
      <td>${esc(i.conductor)}</td>
      <td><b>${esc(i.placa)}</b></td>
      <td><span class="badge ${i.estado === 'completo' ? 'completo' : 'pending'}">${i.estado}</span></td>
      <td><button class="btn-ver" onclick="verDetalle('${i.id}')">Ver detalle</button></td>
    </tr>
  `).join('');
}

async function verDetalle(inspeccionId) {
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalContenido').innerHTML = 'Cargando...';

  const inspeccion = INSPECCIONES.find(i => i.id === inspeccionId);
  document.getElementById('modalTitulo').innerText = `${inspeccion.placa} · ${inspeccion.fecha_inspeccion}`;

  const { data: respuestas } = await db.from('inspeccion_respuestas')
    .select('*, checklist_config(numero, actividad, tipo)')
    .eq('inspeccion_id', inspeccionId)
    .order('checklist_config(numero)');

  const { data: archivos } = await db.from('inspeccion_archivos')
    .select('*')
    .eq('inspeccion_id', inspeccionId);

  const archivosPorItem = {};
  const archivosGenerales = [];
  (archivos || []).forEach(a => {
    if (a.checklist_config_id === null) {
      archivosGenerales.push(a);
    } else {
      if (!archivosPorItem[a.checklist_config_id]) archivosPorItem[a.checklist_config_id] = [];
      archivosPorItem[a.checklist_config_id].push(a);
    }
  });

  let html = `
    <div class="info-grid">
      <div><b>Responsable</b>${esc(inspeccion.responsable)}</div>
      <div><b>Conductor</b>${esc(inspeccion.conductor)}</div>
      <div><b>Tarjeta propiedad</b>${esc(inspeccion.tarjeta_propiedad)}</div>
      <div><b>${inspeccion.destino ? 'Destino' : 'Tipo vehiculo'}</b>${esc(inspeccion.destino || inspeccion.tipo_vehiculo || '-')}</div>
    </div>
  `;

  if (archivosGenerales.length) {
    html += `<div style="margin-bottom:16px;">`;
    archivosGenerales.forEach(a => {
      const { data } = db.storage.from('inspecciones').getPublicUrl(a.storage_path);
      html += `<a href="${data.publicUrl}" target="_blank">📄 PDF de Evidencias Completo</a>`;
    });
    html += `</div>`;
  }

  (respuestas || []).forEach(r => {
    const cfg = r.checklist_config;
    const archivosItem = archivosPorItem[r.checklist_config_id] || [];
    const links = archivosItem.map(a => {
      const { data } = db.storage.from('inspecciones').getPublicUrl(a.storage_path);
      return `<a href="${data.publicUrl}" target="_blank">📄 Ver documento</a>`;
    }).join('');

    html += `
      <div class="item-card">
        <div class="item-top">
          <div class="item-txt"><span class="item-num">${cfg?.numero || ''}.</span> ${esc(cfg?.actividad || '')}</div>
          <span class="${r.cumple === 'SI' ? 'pill-si' : 'pill-no'}">${r.cumple}</span>
        </div>
        ${r.fecha_vencimiento ? `<div class="item-extra">Vence: ${r.fecha_vencimiento}</div>` : ''}
        ${r.observacion ? `<div class="item-extra">Mercancia: ${esc(r.observacion)}</div>` : ''}
        ${links}
      </div>
    `;
  });

  if (inspeccion.observaciones) {
    html += `<div class="item-card"><b style="display:block;margin-bottom:6px;font-weight:600;">Observaciones generales</b>${esc(inspeccion.observaciones)}</div>`;
  }

  document.getElementById('modalContenido').innerHTML = html;
}

async function exportarExcel() {
  const btn = document.getElementById('btnExcel');
  if (!FILTRADAS_ACTUALES.length) { alert('No hay datos para exportar con los filtros actuales.'); return; }

  btn.disabled = true;
  btn.innerText = 'Generando...';

  try {
    const ids = FILTRADAS_ACTUALES.map(i => i.id);
    const { data: archivos } = await db.from('inspeccion_archivos').select('*').in('inspeccion_id', ids);

    const archivosPorInspeccion = {};
    (archivos || []).forEach(a => {
      if (!archivosPorInspeccion[a.inspeccion_id]) archivosPorInspeccion[a.inspeccion_id] = [];
      const { data } = db.storage.from('inspecciones').getPublicUrl(a.storage_path);
      archivosPorInspeccion[a.inspeccion_id].push(data.publicUrl);
    });

    const filas = FILTRADAS_ACTUALES.map(i => ({
      'Fecha Inspeccion': i.fecha_inspeccion,
      'Transportadora': TRANSPORTADORAS_MAP[i.transportadora_id] || '',
      'Responsable': i.responsable,
      'Conductor': i.conductor,
      'Tarjeta Propiedad': i.tarjeta_propiedad,
      'Destino': i.destino || '',
      'Tipo Vehiculo': i.tipo_vehiculo || '',
      'Placa': i.placa,
      'Observaciones': i.observaciones || '',
      'Estado': i.estado,
      'Enlaces Evidencias': (archivosPorInspeccion[i.id] || []).join(' | ')
    }));

    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Inspecciones');
    XLSX.writeFile(wb, `Inspecciones_${PAIS_CODIGO}_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch (err) {
    alert('Error generando Excel: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = '⬇ Descargar Excel';
  }
}

function cerrarModal() { document.getElementById('modalBg').classList.remove('open'); }
function esc(v) { return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
