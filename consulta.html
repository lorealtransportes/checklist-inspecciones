
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Consulta de Inspecciones | L'Oreal Operations</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --black:#1a1a1a; --amber:#c9a84c; --green:#16a34a; --red:#dc2626; --bg:#f5f5f5; --line:#e0e0e0; --muted:#757575; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:Arial, Helvetica, sans-serif; color:#1a1a1a; }
  .page { width:min(1200px, calc(100% - 24px)); margin:0 auto; padding:20px 0 40px; }
  .header { background:#000; color:#fff; padding:18px 24px; border-radius:14px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .header h1 { margin:0; font-size:18px; }
  .header .sub { font-size:12px; color:var(--amber); margin-top:4px; }
  select#filtroPais { padding:8px 12px; border-radius:8px; border:none; font-weight:700; }
  .filters { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 18px; margin-bottom:16px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
  .filters-left { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .filters input, .filters select { padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:13px; }
  .btn-excel { background:var(--green); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:13px; font-weight:800; cursor:pointer; }
  .btn-excel:disabled { opacity:.6; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.05); }
  th { background:#1a1a1a; color:#fff; text-align:left; padding:10px 12px; font-size:12px; }
  td { padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); }
  tr:hover td { background:#fafafa; }
  .badge { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; color:#fff; }
  .badge.completo { background:var(--green); }
  .badge.pending { background:#c9a84c; }
  .btn-ver { background:#1a1a1a; color:#fff; border:none; padding:6px 12px; border-radius:8px; font-size:12px; cursor:pointer; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; z-index:50; }
  .modal-bg.open { display:flex; }
  .modal { background:#fff; border-radius:14px; width:min(700px, 92vw); max-height:85vh; overflow-y:auto; padding:22px; }
  .modal h2 { margin-top:0; font-size:17px; }
  .modal-close { float:right; cursor:pointer; font-weight:800; font-size:18px; }
  .item-row { border-bottom:1px solid var(--line); padding:10px 0; }
  .item-row .si { color:var(--green); font-weight:800; }
  .item-row .no { color:var(--red); font-weight:800; }
  .item-row a { display:inline-block; margin-right:8px; margin-top:4px; font-size:12px; color:#1a1a1a; text-decoration:underline; }
  .empty { text-align:center; padding:40px; color:var(--muted); }
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <div>
      <h1>Consulta de Inspecciones</h1>
      <div class="sub">L'Oreal Operations - Repositorio de evidencias</div>
    </div>
    <div>
      <select id="filtroPais" onchange="cambiarPais()">
        <option value="CO">Colombia</option>
        <option value="PE">Peru</option>
      </select>
    </div>
  </div>

  <div class="filters">
    <div class="filters-left">
      <input type="date" id="filtroFecha" onchange="aplicarFiltros()" />
      <select id="filtroTransportadora" onchange="aplicarFiltros()"><option value="">Todas las transportadoras</option></select>
      <input type="text" id="filtroPlaca" placeholder="Buscar por placa..." oninput="aplicarFiltros()" />
    </div>
    <button class="btn-excel" id="btnExcel" onclick="exportarExcel()">Descargar Excel</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Fecha</th><th>Transportadora</th><th>Responsable</th><th>Conductor</th>
        <th>Placa</th><th>Estado</th><th></th>
      </tr>
    </thead>
    <tbody id="tablaBody">
      <tr><td colspan="7" class="empty">Cargando...</td></tr>
    </tbody>
  </table>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <span class="modal-close" onclick="cerrarModal()">✕</span>
    <h2 id="modalTitulo">Detalle de inspeccion</h2>
    <div id="modalContenido">Cargando...</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ybqblngehgpqthmjsisj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicWJsbmdlaGdwcXRobWpzaXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDY5MjYsImV4cCI6MjEwMzc4MjkyNn0.QOdM7HxPlRhdoA4X8xtIRXCK_noRgXygT1CtgZVdB3E";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(window.location.search);
let PAIS_CODIGO = (params.get('pais') || 'CO').toUpperCase();
let PAIS_ID = null;
let INSPECCIONES = [];
let TRANSPORTADORAS_MAP = {};

document.getElementById('filtroPais').value = PAIS_CODIGO;

async function cambiarPais() {
  PAIS_CODIGO = document.getElementById('filtroPais').value;
  const url = new URL(window.location);
  url.searchParams.set('pais', PAIS_CODIGO);
  window.history.replaceState({}, '', url);
  await cargarDatos();
}

async function cargarDatos() {
  document.getElementById('tablaBody').innerHTML = '<tr><td colspan="7" class="empty">Cargando...</td></tr>';

  const { data: pais } = await db.from('paises').select('id').eq('codigo', PAIS_CODIGO).single();
  if (!pais) {
    document.getElementById('tablaBody').innerHTML = '<tr><td colspan="7" class="empty">Pais no encontrado.</td></tr>';
    return;
  }
  PAIS_ID = pais.id;

  const { data: transp } = await db.from('transportadoras').select('id, nombre').eq('pais_id', PAIS_ID);
  TRANSPORTADORAS_MAP = {};
  (transp || []).forEach(t => TRANSPORTADORAS_MAP[t.id] = t.nombre);

  const selectTransp = document.getElementById('filtroTransportadora');
  selectTransp.innerHTML = '<option value="">Todas las transportadoras</option>' +
    (transp || []).map(t => `<option value="${t.id}">${t.nombre}</option>`).join('');

  const { data: inspecciones, error } = await db.from('inspecciones')
    .select('*')
    .eq('pais_id', PAIS_ID)
    .order('creado_en', { ascending: false });

  if (error) {
    document.getElementById('tablaBody').innerHTML = `<tr><td colspan="7" class="empty">Error: ${error.message}</td></tr>`;
    return;
  }

  INSPECCIONES = inspecciones || [];
  aplicarFiltros();
}

let FILTRADAS_ACTUALES = [];

function aplicarFiltros() {
  const fecha = document.getElementById('filtroFecha').value;
  const transpId = document.getElementById('filtroTransportadora').value;
  const placaTxt = document.getElementById('filtroPlaca').value.toUpperCase().trim();

  FILTRADAS_ACTUALES = INSPECCIONES.filter(i => {
    if (fecha && i.fecha_inspeccion !== fecha) return false;
    if (transpId && String(i.transportadora_id) !== transpId) return false;
    if (placaTxt && !i.placa.includes(placaTxt)) return false;
    return true;
  });

  renderTabla(FILTRADAS_ACTUALES);
}

function renderTabla(lista) {
  const tbody = document.getElementById('tablaBody');
  if (!lista.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">No hay inspecciones que coincidan con el filtro.</td></tr>';
    return;
  }
  tbody.innerHTML = lista.map(i => `
    <tr>
      <td>${i.fecha_inspeccion}</td>
      <td>${TRANSPORTADORAS_MAP[i.transportadora_id] || '-'}</td>
      <td>${esc(i.responsable)}</td>
      <td>${esc(i.conductor)}</td>
      <td><b>${esc(i.placa)}</b></td>
      <td><span class="badge ${i.estado === 'completo' ? 'completo' : 'pending'}">${i.estado}</span></td>
      <td><button class="btn-ver" onclick="verDetalle('${i.id}')">Ver detalle</button></td>
    </tr>
  `).join('');
}

async function verDetalle(inspeccionId) {
  document.getElementById('modalBg').classList.add('open');
  document.getElementById('modalContenido').innerHTML = 'Cargando...';

  const inspeccion = INSPECCIONES.find(i => i.id === inspeccionId);
  document.getElementById('modalTitulo').innerText = `Inspeccion - ${inspeccion.placa} (${inspeccion.fecha_inspeccion})`;

  const { data: respuestas } = await db.from('inspeccion_respuestas')
    .select('*, checklist_config(numero, actividad, tipo)')
    .eq('inspeccion_id', inspeccionId)
    .order('checklist_config(numero)');

  const { data: archivos } = await db.from('inspeccion_archivos')
    .select('*')
    .eq('inspeccion_id', inspeccionId);

  const archivosPorItem = {};
  (archivos || []).forEach(a => {
    if (!archivosPorItem[a.checklist_config_id]) archivosPorItem[a.checklist_config_id] = [];
    archivosPorItem[a.checklist_config_id].push(a);
  });

  let html = `
    <div style="margin-bottom:14px; font-size:13px;">
      <b>Responsable:</b> ${esc(inspeccion.responsable)} &nbsp; | &nbsp;
      <b>Conductor:</b> ${esc(inspeccion.conductor)} &nbsp; | &nbsp;
      <b>Tarjeta:</b> ${esc(inspeccion.tarjeta_propiedad)}<br/>
      ${inspeccion.destino ? `<b>Destino:</b> ${esc(inspeccion.destino)}` : `<b>Tipo vehiculo:</b> ${esc(inspeccion.tipo_vehiculo || '-')}`}
    </div>
  `;

  (respuestas || []).forEach(r => {
    const cfg = r.checklist_config;
    const cumpleClass = r.cumple === 'SI' ? 'si' : 'no';
    const archivosItem = archivosPorItem[r.checklist_config_id] || [];
    const links = archivosItem.map(a => {
      const { data } = db.storage.from('inspecciones').getPublicUrl(a.storage_path);
      return `<a href="${data.publicUrl}" target="_blank">${a.tipo_archivo === 'pdf' ? '📄 PDF' : '📷 Foto'}</a>`;
    }).join('');

    html += `
      <div class="item-row">
        <b>${cfg?.numero || ''}.</b> ${esc(cfg?.actividad || '')} —
        <span class="${cumpleClass}">${r.cumple}</span>
        ${r.fecha_vencimiento ? ` (Vence: ${r.fecha_vencimiento})` : ''}
        ${r.observacion ? `<br/><i>Mercancia: ${esc(r.observacion)}</i>` : ''}
        <br/>${links || '<span style="color:#999;font-size:12px;">Sin adjunto</span>'}
      </div>
    `;
  });

  if (inspeccion.observaciones) {
    html += `<div style="margin-top:14px;"><b>Observaciones generales:</b><br/>${esc(inspeccion.observaciones)}</div>`;
  }

  document.getElementById('modalContenido').innerHTML = html;
}

async function exportarExcel() {
  const btn = document.getElementById('btnExcel');
  if (!FILTRADAS_ACTUALES.length) { alert('No hay datos para exportar con los filtros actuales.'); return; }

  btn.disabled = true;
  btn.innerText = 'Generando...';

  try {
    const ids = FILTRADAS_ACTUALES.map(i => i.id);
    const { data: archivos } = await db.from('inspeccion_archivos').select('*').in('inspeccion_id', ids);

    const archivosPorInspeccion = {};
    (archivos || []).forEach(a => {
      if (!archivosPorInspeccion[a.inspeccion_id]) archivosPorInspeccion[a.inspeccion_id] = [];
      const { data } = db.storage.from('inspecciones').getPublicUrl(a.storage_path);
      archivosPorInspeccion[a.inspeccion_id].push(data.publicUrl);
    });

    const filas = FILTRADAS_ACTUALES.map(i => ({
      'Fecha Inspeccion': i.fecha_inspeccion,
      'Transportadora': TRANSPORTADORAS_MAP[i.transportadora_id] || '',
      'Responsable': i.responsable,
      'Conductor': i.conductor,
      'Tarjeta Propiedad': i.tarjeta_propiedad,
      'Destino': i.destino || '',
      'Tipo Vehiculo': i.tipo_vehiculo || '',
      'Placa': i.placa,
      'Observaciones': i.observaciones || '',
      'Estado': i.estado,
      'Enlaces Evidencias': (archivosPorInspeccion[i.id] || []).join(' | ')
    }));

    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Inspecciones');
    XLSX.writeFile(wb, `Inspecciones_${PAIS_CODIGO}_${new Date().toISOString().slice(0,10)}.xlsx`);
  } catch (err) {
    alert('Error generando Excel: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = 'Descargar Excel';
  }
}

function cerrarModal() { document.getElementById('modalBg').classList.remove('open'); }
function esc(v) { return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

cargarDatos();
</script>
</body>
</html>
