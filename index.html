
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>L'Oreal Operations | Inspeccion de Vehiculos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --amber:#c9a84c; --amber-lt:#e8d9ae; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    background: radial-gradient(circle at top, #1a1a1a 0%, #000000 70%);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .wrap { max-width:920px; width:100%; }
  .top { text-align:center; margin-bottom:44px; }
  .top .logo { color:#fff; font-size:22px; font-weight:800; letter-spacing:1px; }
  .top .logo span { color:var(--amber); }
  .top .division { color:rgba(255,255,255,.4); font-size:10px; letter-spacing:4px; text-transform:uppercase; margin-top:6px; font-weight:600; }
  .top h1 { color:#fff; font-size:24px; font-weight:700; margin:20px 0 6px; }
  .top p { color:rgba(255,255,255,.5); font-size:13px; font-weight:400; }

  .countries { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .country-card {
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px; padding:32px 26px;
    backdrop-filter:blur(10px);
    transition:transform .2s, border-color .2s;
    text-align:center;
  }
  .country-card:hover { transform:translateY(-4px); border-color:var(--amber); }

  .flag-img { width:56px; height:auto; margin-bottom:14px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .country-card h2 { color:#fff; margin:0 0 20px; font-size:19px; font-weight:700; }

  .link-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:13px; margin-bottom:10px; border-radius:12px;
    text-decoration:none; font-weight:600; font-size:13.5px;
    transition:opacity .15s, transform .1s;
  }
  .link-btn:hover { opacity:.88; transform:scale(1.01); }
  .link-btn:last-child { margin-bottom:0; }

  .btn-llenar { background:var(--amber); color:#1a1a1a; }
  .btn-consultar { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.15); }
  .btn-archivos { background:transparent; color:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.1); }

  .footer { text-align:center; margin-top:36px; color:rgba(255,255,255,.25); font-size:11px; font-weight:400; letter-spacing:.5px; }

  @media (max-width:640px) { .countries { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">L'OR<span>É</span>AL</div>
    <div class="division">OPERATIONS</div>
    <h1>Inspeccion de Vehiculos</h1>
    <p>Selecciona el pais para continuar</p>
  </div>

  <div class="countries">
    <div class="country-card">
      <img class="flag-img" src="https://flagcdn.com/w80/co.png" alt="Colombia" />
      <h2>Colombia</h2>
      <a class="link-btn btn-llenar" href="newCheckList.html?pais=CO">Llenar Inspeccion</a>
      <a class="link-btn btn-consultar" href="consulta.html?pais=CO">Consultar Registros</a>
      <a class="link-btn btn-archivos" href="archivos.html?pais=CO">Repositorio de Archivos</a>
    </div>

    <div class="country-card">
      <img class="flag-img" src="https://flagcdn.com/w80/pe.png" alt="Peru" />
      <h2>Peru</h2>
      <a class="link-btn btn-llenar" href="newCheckList.html?pais=PE">Llenar Inspeccion</a>
      <a class="link-btn btn-consultar" href="consulta.html?pais=PE">Consultar Registros</a>
      <a class="link-btn btn-archivos" href="archivos.html?pais=PE">Repositorio de Archivos</a>
    </div>
  </div>

  <div class="footer">L'OREAL OPERATIONS · SISTEMA DE INSPECCION DE VEHICULOS</div>
</div>
</body>
</html>
