<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel Administrador | L'Oreal Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --amber:#c9a84c; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh;
    background: radial-gradient(circle at top, #1a1a1a 0%, #000000 70%);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .wrap { max-width:420px; width:100%; }
  .top { text-align:center; margin-bottom:30px; }
  .top .division { color:rgba(255,255,255,.4); font-size:10px; letter-spacing:4px; text-transform:uppercase; font-weight:600; }
  .top h1 { color:#fff; font-size:22px; font-weight:700; margin:14px 0 6px; }
  .top p { color:rgba(255,255,255,.5); font-size:13px; }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:20px; padding:32px 26px; backdrop-filter:blur(10px); }
  label { color:rgba(255,255,255,.6); font-size:12px; font-weight:600; display:block; margin-bottom:6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.06); color:#fff; font-size:14px; margin-bottom:16px; outline:none; }
  input:focus { border-color:var(--amber); }
  .btn { display:block; width:100%; text-align:center; padding:13px; border-radius:12px; text-decoration:none; font-weight:600; font-size:14px; border:none; cursor:pointer; transition:opacity .15s, transform .1s; margin-bottom:10px; }
  .btn:hover { opacity:.88; transform:scale(1.01); }
  .btn-primary { background:var(--amber); color:#1a1a1a; }
  .btn-secondary { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.15); }
  .btn-ghost { background:transparent; color:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.1); }
  .error-msg { color:#ff6b6b; font-size:12.5px; margin:-6px 0 14px; min-height:16px; text-align:center; }
  .hidden { display:none !important; }
  .country-select { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .country-btn { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:22px 10px; text-align:center; cursor:pointer; transition:border-color .15s, transform .1s; }
  .country-btn:hover { border-color:var(--amber); transform:translateY(-2px); }
  .country-btn img { width:48px; display:block; margin:0 auto 10px; border-radius:4px; }
  .country-btn span { color:#fff; font-size:14px; font-weight:600; }
  .pais-badge { text-align:center; margin-bottom:18px; }
  .pais-badge img { width:32px; vertical-align:middle; border-radius:3px; margin-right:8px; }
  .pais-badge span { color:#fff; font-size:14px; font-weight:600; vertical-align:middle; }
  .change-pais { display:block; text-align:center; color:rgba(255,255,255,.4); font-size:11.5px; margin-top:-8px; margin-bottom:18px; text-decoration:underline; cursor:pointer; }
  .user-badge { text-align:center; color:rgba(255,255,255,.4); font-size:12px; margin-bottom:18px; }
  .actions { margin-top:18px; }
  .back-link { display:block; text-align:center; margin-top:18px; color:rgba(255,255,255,.35); font-size:12px; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="division">OPERATIONS</div>
    <h1>Panel Administrador</h1>
    <p id="subtitle">Selecciona el pais para continuar</p>
  </div>

  <div class="card">

    <!-- PASO 1: SELECCION DE PAIS -->
    <div id="paisBox">
      <div class="country-select">
        <div class="country-btn" id="btnCO" data-pais="CO">
          <img src="https://flagcdn.com/w80/co.png" alt="Colombia" />
          <span>Colombia</span>
        </div>
        <div class="country-btn" id="btnPE" data-pais="PE">
          <img src="https://flagcdn.com/w80/pe.png" alt="Peru" />
          <span>Peru</span>
        </div>
      </div>
    </div>

    <!-- PASO 2: LOGIN (aparece tras elegir pais) -->
    <div id="loginBox" class="hidden">
      <div class="pais-badge" id="paisBadge"></div>
      <span class="change-pais" id="changePais">← Cambiar pais</span>
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="nombre@loreal.com" autocomplete="username" />
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="error-msg" id="loginError"></div>
      <button class="btn btn-primary" id="loginBtn">Iniciar sesion</button>
    </div>

    <!-- PASO 3: PANEL YA AUTENTICADO -->
    <div id="appBox" class="hidden">
      <div class="pais-badge" id="paisBadgeApp"></div>
      <div class="user-badge" id="userBadge"></div>

      <div class="actions">
        <a class="btn btn-secondary" id="linkConsulta" href="#">Consultar Registros</a>
        <a class="btn btn-ghost" id="linkArchivos" href="#">Repositorio de Archivos</a>
      </div>

      <button class="btn btn-ghost" id="logoutBtn" style="margin-top:20px;">Cerrar sesion</button>
    </div>

  </div>

  <a class="back-link" href="index.html">← Volver al inicio</a>
</div>

<script>
  // ⚠ REEMPLAZA estos dos valores con los de tu proyecto Supabase
  // Settings > API > Project URL / anon public key
  
const SUPABASE_URL = "https://ybqblngehgpqthmjsisj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlicWJsbmdlaGdwcXRobWpzaXNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDY5MjYsImV4cCI6MjEwMzc4MjkyNn0.QOdM7HxPlRhdoA4X8xtIRXCK_noRgXygT1CtgZVdB3E"


  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const paisBox = document.getElementById("paisBox");
  const loginBox = document.getElementById("loginBox");
  const appBox = document.getElementById("appBox");
  const loginError = document.getElementById("loginError");
  const userBadge = document.getElementById("userBadge");
  const paisBadge = document.getElementById("paisBadge");
  const paisBadgeApp = document.getElementById("paisBadgeApp");
  const subtitle = document.getElementById("subtitle");
  const linkConsulta = document.getElementById("linkConsulta");
  const linkArchivos = document.getElementById("linkArchivos");

  const paisInfo = {
    CO: { nombre: "Colombia", flag: "https://flagcdn.com/w40/co.png" },
    PE: { nombre: "Peru", flag: "https://flagcdn.com/w40/pe.png" }
  };

  let selectedPais = null;

  function badgeHtml(pais) {
    const info = paisInfo[pais];
    return `<img src="${info.flag}" alt="${info.nombre}" /><span>${info.nombre}</span>`;
  }

  function goToLogin(pais) {
    selectedPais = pais;
    paisBadge.innerHTML = badgeHtml(pais);
    paisBox.classList.add("hidden");
    loginBox.classList.remove("hidden");
    appBox.classList.add("hidden");
    subtitle.textContent = "Ingresa tus credenciales";
    loginError.textContent = "";
  }

  function goToPaisSelect() {
    selectedPais = null;
    paisBox.classList.remove("hidden");
    loginBox.classList.add("hidden");
    appBox.classList.add("hidden");
    subtitle.textContent = "Selecciona el pais para continuar";
  }

  function showApp(session, pais) {
    paisBox.classList.add("hidden");
    loginBox.classList.add("hidden");
    appBox.classList.remove("hidden");
    subtitle.textContent = "Sesion activa";
    paisBadgeApp.innerHTML = badgeHtml(pais);
    userBadge.textContent = session.user.email;
    linkConsulta.href = `consulta.html?pais=${pais}`;
    linkArchivos.href = `archivos.html?pais=${pais}`;
  }

  document.getElementById("btnCO").addEventListener("click", () => goToLogin("CO"));
  document.getElementById("btnPE").addEventListener("click", () => goToLogin("PE"));
  document.getElementById("changePais").addEventListener("click", goToPaisSelect);

  document.getElementById("loginBtn").addEventListener("click", async () => {
    loginError.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      loginError.textContent = "Completa correo y contraseña.";
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      loginError.textContent = "Credenciales invalidas.";
      return;
    }

    // Validacion clave: el pais de la cuenta debe coincidir con el pais elegido
    const cuentaPais = data.user.user_metadata && data.user.user_metadata.pais;

    if (cuentaPais !== selectedPais) {
      await supabaseClient.auth.signOut();
      loginError.textContent = `Esta cuenta no tiene acceso a ${paisInfo[selectedPais].nombre}.`;
      return;
    }

    showApp(data.session, selectedPais);
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    goToPaisSelect();
  });

  // Si ya hay sesion activa (recarga de pagina), la revalidamos contra un pais
  // guardado temporalmente en la pestaña (no persiste entre sesiones nuevas por seguridad)
  supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
      const cuentaPais = data.session.user.user_metadata && data.session.user.user_metadata.pais;
      const paisGuardado = sessionStorage.getItem("adminPaisActivo");
      if (cuentaPais && paisGuardado === cuentaPais) {
        showApp(data.session, cuentaPais);
      } else {
        // Sesion tecnica activa pero sin pais confirmado en esta pestaña: pedir de nuevo el flujo
        supabaseClient.auth.signOut();
      }
    }
  });

  // Guarda el pais activo en la pestaña actual justo cuando el login es exitoso
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_IN" && session && selectedPais) {
      sessionStorage.setItem("adminPaisActivo", selectedPais);
    }
    if (event === "SIGNED_OUT") {
      sessionStorage.removeItem("adminPaisActivo");
    }
  });
</script>
</body>
</html>
